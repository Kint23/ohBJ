<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>帝京寻踪 · Banner 生成器（1200×675）</title>
<style>
  :root{--paper:#f6f1e6;--ink:#2b241c;--seal:#9c2b25;--line:#ddd0b6;--muted:#8c8271}
  body{margin:0;padding:20px;background:#efe7d7;color:var(--ink);
       font-family:"Microsoft YaHei","PingFang SC",serif}
  h1{font-size:16px;margin:0 0 4px}
  p{font-size:13px;color:#6b5f4d;margin:0 0 14px;line-height:1.7}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  button,select{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);
    border-radius:6px;background:#fffdf8;cursor:pointer}
  button.primary{background:var(--seal);color:#fff;border-color:var(--seal)}
  img{max-width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 10px rgba(60,45,20,.12);background:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8}
  code{background:#fffdf8;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<h1>帝京寻踪 · 参赛 Banner 生成器</h1>
<p>固定 <b>1200 × 675</b>（大赛要求尺寸），点击下载得到 PNG。所有字形都用系统字体在本机渲染，无需联网。</p>

<div class="bar">
  <button id="dl" class="primary">下载 PNG（1200×675）</button>
  <label>标题：<input id="t1" value="帝京寻踪" style="font:inherit;font-size:13px;padding:6px 8px;width:140px;border:1px solid var(--line);border-radius:6px" /></label>
  <label>副题：<input id="t2" value="明代北京古今地图" style="font:inherit;font-size:13px;padding:6px 8px;width:180px;border:1px solid var(--line);border-radius:6px" /></label>
  <button id="redraw">重绘</button>
</div>

<img id="preview" alt="Banner 预览" />

<p class="hint">
  上传前自查：尺寸 <b>1200×675</b> ／ 格式 PNG 或 JPG ／ <b>≤ 5MB</b>（本图约 0.3–0.6MB）。<br />
  若字变成方框，把系统的「微软雅黑」装上即可；也可改 <code>banner/index.html</code> 里的字体名。
</p>

<script>
(function () {
  "use strict";
  var W = 1200, H = 675;
  var canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  var g = canvas.getContext("2d");

  function rr(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // 确定性伪随机，保证每次重绘结果一致
  function rnd(seed) { return function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }; }

  function spacedText(text, x, y, gap) {
    var cx = x;
    for (var i = 0; i < text.length; i++) {
      g.fillText(text.charAt(i), cx, y);
      cx += g.measureText(text.charAt(i)).width + gap;
    }
  }

  function draw(title, subtitle) {
    var serif = '"Source Han Serif SC","Songti SC","SimSun",serif';
    var sans = '"Microsoft YaHei","PingFang SC",sans-serif';

    // 纸底
    g.fillStyle = "#f6f1e6";
    g.fillRect(0, 0, W, H);

    // 纸纹（淡墨点，确定性地撒）
    var r = rnd(20260929);
    for (var i = 0; i < 900; i++) {
      var x = r() * W, y = r() * H, a = 0.012 + r() * 0.03;
      g.fillStyle = "rgba(90,74,48," + a.toFixed(3) + ")";
      g.fillRect(x, y, 1.4, 1.4);
    }

    // 装饰：右上角同心弧（呼应古地图罗盘/水波）
    g.save();
    g.translate(W - 120, 96);
    for (var k = 0; k < 5; k++) {
      g.beginPath();
      g.arc(0, 0, 34 + k * 22, Math.PI * 0.55, Math.PI * 1.45);
      g.strokeStyle = "rgba(184,145,47," + (0.30 - k * 0.045).toFixed(3) + ")";
      g.lineWidth = 1.6;
      g.stroke();
    }
    g.restore();

    // 双线内框
    g.strokeStyle = "#ddd0b6";
    g.lineWidth = 1;
    g.strokeRect(28, 28, W - 56, H - 56);
    g.strokeStyle = "rgba(184,145,47,.55)";
    g.strokeRect(35, 35, W - 70, H - 70);

    // 朱印「帝京」
    g.fillStyle = "#9c2b25";
    rr(72, 74, 86, 86, 8); g.fill();
    g.fillStyle = "#fff";
    g.font = "600 38px " + serif;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("帝", 72 + 43, 74 + 30);
    g.fillText("京", 72 + 43, 74 + 62);

    // 标题
    g.textAlign = "left"; g.textBaseline = "alphabetic";
    g.fillStyle = "#2b241c";
    g.font = "700 62px " + serif;
    spacedText(title, 188, 132, 6);

    g.fillStyle = "#6b5f4d";
    g.font = "400 22px " + sans;
    spacedText(subtitle, 190, 166, 4);

    // 分隔线
    g.strokeStyle = "#ddd0b6";
    g.beginPath(); g.moveTo(190, 186); g.lineTo(W - 90, 186); g.stroke();

    // ---- 核心对照卡 ----
    var cx = 96, cy = 224, cw = W - 192, ch = 214;
    g.fillStyle = "#fffdf8";
    rr(cx, cy, cw, ch, 12); g.fill();
    g.strokeStyle = "#ddd0b6"; g.stroke();

    // 左侧：明清地名
    g.fillStyle = "#8c8271";
    g.font = "400 15px " + sans;
    g.fillText("明代《帝京景物略》卷一 · 城北内外", cx + 34, cy + 44);

    g.fillStyle = "#2b241c";
    g.font = "700 46px " + serif;
    g.fillText("太學石鼓", cx + 34, cy + 100);

    // 箭头
    g.strokeStyle = "#b8912f"; g.lineWidth = 3;
    var ax = cx + 300, ay = cy + 84;
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax + 92, ay); g.stroke();
    g.beginPath(); g.moveTo(ax + 78, ay - 9); g.lineTo(ax + 94, ay); g.lineTo(ax + 78, ay + 9); g.stroke();

    // 右侧：今地名
    g.fillStyle = "#8c8271";
    g.font = "400 15px " + sans;
    g.fillText("今日百度地图地点", ax + 130, cy + 44);

    g.fillStyle = "#9c2b25";
    g.font = "700 40px " + sans;
    g.fillText("北京孔庙和国子监博物馆", ax + 130, cy + 96);

    g.fillStyle = "#8c8271";
    g.font = "400 14px " + sans;
    g.fillText("BD-09 116.42027, 39.95288 ｜ 已用百度地点检索核验", ax + 130, cy + 124);

    // 卡内底部：体验说明
    g.fillStyle = "#3a3126";
    g.font = "400 17px " + sans;
    g.fillText("点开即见：原书记载 · 关联诗词 · 白话今译 · 清人《京城古迹考》的实地核访", cx + 34, cy + 172);

    // ---- 数据条 ----
    var chips = ["30 处明代地点", "519 首关联诗篇", "127 目古籍语料", "8 个步行圈 + 2 / 3 / 5 日行程"];
    var x = 96, y = 496;
    g.font = "400 15px " + sans;
    chips.forEach(function (t) {
      var w = g.measureText(t).width + 30;
      g.fillStyle = "#efe7d7";
      rr(x, y - 24, w, 34, 17); g.fill();
      g.strokeStyle = "#ddd0b6"; g.stroke();
      g.fillStyle = "#6b5f4d";
      g.fillText(t, x + 15, y - 1);
      x += w + 12;
    });

    // ---- 主张 ----
    g.fillStyle = "#2b241c";
    g.font = "700 34px " + serif;
    spacedText("把四百年前的北京，叠回今天的地图", 96, 580, 2);

    // ---- 页脚 ----
    g.fillStyle = "#8c8271";
    g.font = "400 14px " + sans;
    g.fillText("基于百度地图 JSAPI GL / WebAPI ｜ 数据源《帝京景物略》(1635)、《京城古迹考》、《日下舊聞考》", 96, 616);

    // 右下角标识
    g.textAlign = "right";
    g.fillStyle = "#9c2b25";
    g.font = "600 14px " + sans;
    g.fillText("开发者创作大赛 · 创意应用", W - 60, 616);
    g.textAlign = "left";
  }

  function redraw() {
    draw(
      document.getElementById("t1").value || "帝京寻踪",
      document.getElementById("t2").value || "明代北京古今地图"
    );
    document.getElementById("preview").src = canvas.toDataURL("image/png");
  }

  document.getElementById("dl").onclick = function () {
    canvas.toBlob(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "帝京寻踪-banner-1200x675.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    }, "image/png");
  };
  document.getElementById("redraw").onclick = redraw;
  redraw();
})();
</script>
</body>
</html>
